<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <radialGradient id="csiaGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#84ff00" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#84ff00" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="csiaLine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#84ff00"/>
      <stop offset="100%" stop-color="#46a300"/>
    </linearGradient>
    <pattern id="gridCsia" width="10" height="10" patternUnits="userSpaceOnUse">
      <path d="M 10 0 L 0 0 0 10" fill="none" stroke="rgba(132, 255, 0, 0.08)" stroke-width="0.5"/>
    </pattern>
  </defs>

  <!-- Dark Background & Grid -->
  <rect width="160" height="160" fill="#06090e" rx="4"/>
  <rect width="160" height="160" fill="url(#gridCsia)"/>
  <circle cx="80" cy="80" r="70" fill="url(#csiaGlow)"/>

  <!-- Outer HUD Ring & Crosshairs -->
  <circle cx="80" cy="80" r="66" fill="none" stroke="#84ff00" stroke-width="1.5" stroke-dasharray="8 4" opacity="0.6"/>
  <circle cx="80" cy="80" r="60" fill="none" stroke="rgba(132, 255, 0, 0.25)" stroke-width="1"/>
  <line x1="80" y1="6" x2="80" y2="16" stroke="#84ff00" stroke-width="2"/>
  <line x1="80" y1="144" x2="80" y2="154" stroke="#84ff00" stroke-width="2"/>
  <line x1="6" y1="80" x2="16" y2="80" stroke="#84ff00" stroke-width="2"/>
  <line x1="144" y1="80" x2="154" y2="80" stroke="#84ff00" stroke-width="2"/>

  <!-- Cyber Silhouette (Hooded / Tactical Shoulders) -->
  <path d="M 28 148 C 28 122 48 106 62 102 C 60 96 58 90 58 80 C 58 60 68 46 80 46 C 92 46 102 60 102 80 C 102 90 100 96 98 102 C 112 106 132 122 132 148 Z" fill="#0d141e" stroke="rgba(132, 255, 0, 0.35)" stroke-width="1.5"/>

  <!-- Head Shadow & Visor Area -->
  <ellipse cx="80" cy="74" rx="20" ry="24" fill="#080c12" stroke="#84ff00" stroke-width="1.5"/>

  <!-- Glowing Neon '?' Symbol -->
  <g fill="#84ff00" filter="drop-shadow(0px 0px 4px #84ff00)">
    <!-- ? Head -->
    <path d="M 72 63 C 72 58 75 55 80 55 C 85 55 88 58 88 62 C 88 66 85 68 82 70 L 82 76 L 78 76 L 78 69 C 82 67 84 65 84 62 C 84 60 82 58 80 58 C 78 58 76 60 76 63 Z"/>
    <!-- ? Dot -->
    <rect x="78" y="80" width="4" height="4" rx="0.5"/>
  </g>

  <!-- Tactical HUD Scanline & Corner Brackets -->
  <line x1="25" y1="25" x2="35" y2="25" stroke="#84ff00" stroke-width="2"/>
  <line x1="25" y1="25" x2="25" y2="35" stroke="#84ff00" stroke-width="2"/>
  <line x1="135" y1="25" x2="125" y2="25" stroke="#84ff00" stroke-width="2"/>
  <line x1="135" y1="25" x2="135" y2="35" stroke="#84ff00" stroke-width="2"/>

  <!-- Lower Tactical Tag -->
  <rect x="36" y="132" width="88" height="16" fill="#05080c" stroke="#84ff00" stroke-width="1"/>
  <text x="80" y="143" font-family="'Courier New', monospace" font-size="8" font-weight="bold" fill="#84ff00" text-anchor="middle" letter-spacing="1">CSIA // ARCHITECT</text>
</svg>
